<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menata Runtime — Case</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full text-slate-900">
<div class="border-b border-amber-200 bg-amber-50 px-4 py-2 text-center text-xs font-medium text-amber-800">UI Sample — case exploration. Static mockup, not wired to real data or the runtime.</div>
<header class="border-b border-slate-200 bg-white px-4 py-4 sm:px-6">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4">
    <a href="index.html" class="text-sm font-semibold">Menata Runtime <span class="font-normal text-slate-400">/ Case Portfolio</span></a>
    <a href="index.html" class="text-xs font-medium text-blue-600 hover:underline">← All cases</a>
  </div>
</header>
<main id="app" class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
  <div class="rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <div class="animate-pulse space-y-3"><div class="h-3 w-24 rounded bg-slate-100"></div><div class="h-7 w-80 rounded bg-slate-100"></div><div class="h-4 w-full max-w-2xl rounded bg-slate-100"></div></div>
  </div>
</main>
<script>
const cases = {
1:{title:'Design Request',domain:'Creative services workflow',app:'Design',roles:'Requester · Designer',status:'Implemented / foundational',cluster:'CRUD + simple state machine',targets:'F01–F04 · E01 · A01 · C01–C04 · P01 · V01–V03',reality:'Requester submits a design request; a Designer accepts or rejects it, starts work, and completes it. Banner 2:1 requests require an attachment.',flow:['Draft','Submitted','Accepted','In Progress','Completed'],screens:[['Request form','Form','Fields for requester, design type, due date, brief, rich text and conditional attachment.'],['Design request list','List','Open / pending / completed requests with requester, type, status and due date.'],['Request detail','Detail','Record header, workflow state, fields and contextual actions.']],note:'Cases 1–2 are the foundational CRUD/view cluster. The repository treats this case as already done, so this page is a visual reference rather than a new capability proposal.'},
2:{title:'Leave Request',domain:'HR · employee leave approval',app:'HR',roles:'Employee · Manager',status:'Implemented / portability proof',cluster:'Domain portability',targets:'Same cluster as Case 1 · V01–V03',reality:'An employee submits leave; a Manager approves or rejects; the employee may cancel before approval.',flow:['Draft','Submitted','Approved / Rejected','Cancelled'],screens:[['Leave request form','Form','Leave type, start/end date, reason and notes.'],['Leave worklist','List','Employee and manager views with pending, approved and rejected requests.'],['Leave detail','Detail','Request summary, dates, reason, status and available transition.']],note:'This case deliberately reuses the same shape as Design Request in a different domain and application.'},
3:{title:'Document Approval',domain:'Multi-approver document workflow',app:'Approval',roles:'Submitter · Approver · System',status:'Mocked · extended',cluster:'Sequence · synchronization · resource allocation',targets:'CAP-F13 · A07 · A08 · X03 · P02 · E05 · F22/F23/F24 · V20/V21/V28 · V10',reality:'A submitted PDF follows a sequential or parallel approval flow. Approvers may be sourced from users or groups; signatures can be positioned on the PDF; the flow can be saved by document type.',flow:['Draft','In Review','Approved / Rejected'],screens:[['Submit document','Wizard / Form','Document metadata, PDF attachment, Sequential/Parallel mode, per-step User/Group assignee, step reordering and optional saved flow.','document-submit.html'],['Signature positions','Coordinate editor','PDF preview with a marker per approval step.','document-signature-placement.html'],['Approval inbox','Worklist + Detail','Pending approvals, SLA chips, approval progress, PDF and Approve/Reject action bar.','document-approval.html'],['Approval dashboard','Composed page','Summary KPI tiles + pending-document list + recent-activity feed.','approval-dashboard.html']],note:'This is the richest existing case UI. The repo explicitly records live refinements around self-hosted progress, signature placement, group-scoped approvers, curated navigation and composed-page rendering.'},
4:{title:'Maintenance Reminder',domain:'Facility · recurring equipment maintenance',app:'Facility',roles:'Technician · Supervisor',status:'Documented boundary test',cluster:'Time-driven behavior',targets:'E02 · E03 · A02 · A09 · A11',reality:'Equipment maintenance tasks recur on schedules. A task becomes Due, escalates when overdue, and on completion records the completion date and advances the next due date by frequency.',flow:['Scheduled','Due','Overdue','Completed → Scheduled'],screens:[['Maintenance worklist','List','Tasks grouped by Due / Overdue / Scheduled with equipment, assignee and next due date.'],['Maintenance task','Detail','Equipment, frequency, next due date, last completion and completion action.'],['Daily maintenance board','Calendar / Agenda','A day-oriented operational view for technicians and supervisors.']],note:'The portfolio declares time-driven events and date arithmetic as the dominant cluster; date arithmetic was an untargeted finding promoted to CAP-A11.'},
5:{title:'Inventory / Stock Movement',domain:'Warehouse · multi-UoM stock control',app:'Warehouse',roles:'Warehouse Staff',status:'Documented boundary test',cluster:'Calculation + multi-record transaction',targets:'F07 · F13 · F14 · F16 · F19 · A02 · A06 · C05 · C07 · C08 · X12',reality:'Goods move in and out of a warehouse. Confirming a movement creates an immutable ledger entry, normalizes quantity by unit, updates stock on hand and rejects a movement that would make stock negative.',flow:['Requested','Confirmed','Rejected'],screens:[['Item master','List + Detail','Item, base unit, stock-on-hand, UoM conversions and ledger history.'],['Stock movement form','Form','Movement type, item, quantity, unit, requested date and confirmation.'],['Stock ledger','Ledger / List','Immutable movement history with normalized quantities and running balance.'],['Stock detail','Detail','Current stock, recent movements and conversion context.']],note:'The declared cluster is intentionally transactional: references, calculated balance, child conversion records, constraints and atomic cross-record writes.'},
6:{title:'Petty Cash Ledger',domain:'Small cash box · imprest fund',app:'Petty Cash',roles:'Custodian · Auditor',status:'Documented boundary test',cluster:'Numeric aggregation + immutability',targets:'F08 · F13 · F14 · A02 · C08 · C10 · P03 · E06/R07 · R04',reality:'A fixed imprest fund is controlled by one Custodian, every voucher reduces the current balance, an independent Auditor reconciles the period and a closed period is frozen.',flow:['Open Period','Voucher Recorded','Reconciled','Closed'],screens:[['Fund dashboard','Dashboard','Fixed float, current balance, open vouchers and reconciliation status.'],['Cash voucher','Form','Expense amount, reason, recorded-by and fund reference.'],['Period reconciliation','Form / Checklist','Cash counted plus voucher total against fixed imprest amount; independent reconciler.'],['Closed period','Detail','Frozen period with audit trail and reconciliation result.']],note:'This case is the cleanest UI expression of a running-balance ledger with a period boundary and separation of duties.'},
7:{title:'Customer Complaint',domain:'Customer service · ad-hoc case management',app:'Customer Service',roles:'Agent · Supervisor · Customer',status:'Documented boundary test',cluster:'Unstructured case management',targets:'E02 · E05 · A09 · A11 · A12 · A13 · P04 · C09 · V09 · WCP-10',reality:'Complaints can be investigated in no fixed order, have priority-driven SLA, escalate on breach and can be reopened after resolution.',flow:['Open','Triage','Investigating','Resolved','Reopened'],screens:[['Complaint queue','List','Open, overdue and priority-ranked complaints with SLA and assignee.'],['Complaint detail','Detail','Customer issue, timeline, current owner, SLA and available actions.'],['Investigation workspace','Flexible workspace','Ad-hoc investigation items, notes, evidence and resolution notes.'],['Escalation view','List / Monitor','Overdue complaints and supervisor escalation state.']],note:'The repository explicitly frames this as the CMMN-style case-management boundary: bounded discretionary work, SLA, escalation and reopen.'},
8:{title:'Payment Confirmation',domain:'Payments · webhook ingestion and reconciliation',app:'Payments',roles:'Finance · System',status:'Documented boundary test',cluster:'External events + idempotency',targets:'E04 · X07 · X13 · A06 · A13 · X12 · C08',reality:'A payment provider sends a webhook. Duplicate delivery must return success without double-applying; matched payments update the Invoice exactly once, while unmatched payments wait for manual reconciliation.',flow:['Received','Processed / Duplicate','Reconciled','Exception'],screens:[['Webhook event log','List','Provider event ID, received time, duplicate state and processing result.'],['Payment detail','Detail','Raw event, payment status, invoice match and reconciliation state.'],['Reconciliation queue','List','Unmatched payments requiring Finance review.'],['Invoice payment detail','Detail','Invoice amount paid, status and linked payment history.']],note:'The key visual distinction is between raw event ingestion and domain reconciliation. Idempotency is represented explicitly instead of hiding it behind a generic payment status.'},
9:{title:'Accounting',domain:'Small-org bookkeeping · monthly close',app:'Accounting',roles:'Accountant · Supervisor',status:'Documented boundary test',cluster:'Header-detail accounting + controls',targets:'F13 · F14 · F16 · F18 · A02 · C10 · C11 · P03 · R04 · R07 · E06 · V13',reality:'Accountants create journal entries with debit/credit lines, a Supervisor posts them, closed periods are immutable and Trial Balance groups totals by account.',flow:['Draft','Posted','Closed period'],screens:[['Chart of Accounts','Tree List','Hierarchical accounts, type, code and normal balance.'],['Journal entry form','Form + Lines','Header plus debit/credit child rows with balanced-total feedback.'],['Journal entry detail','Detail','Prepared/posted by, posting date, lines, audit trail and frozen state.'],['Trial Balance','Aggregate report','Group by Account and show debit, credit and net balance.']],note:'The repository emphasizes controls as much as data shape: separation of duties, audit trail, closed-period constraint and post-state immutability.'},
10:{title:'Organization Composite',domain:'One organization running multiple applications together',app:'Workspace',roles:'Cross-application users',status:'Composition study',cluster:'Shared identity + master data + workspace services',targets:'F13 · I01–I05 · X09 · V10 · P05 → CAP-O01…O06',reality:'PT Maju Bersama runs multiple applications in one workspace. One employee crosses HR, Facility, Approval and Safety in a single morning.',flow:['Workspace home','Application','Machine / View'],screens:[['Workspace home','Composed dashboard','Cross-application KPI, favorites, recent work and role-aware navigation.'],['Global search','Search','Permission-trimmed search across Machines and applications.'],['Unified inbox','Inbox','Notifications and tasks from multiple applications.'],['Business calendar','Calendar','Shared holidays and working-day rules consumed by apps.'],['Master data directory','Directory','Canonical Employee / Customer / Equipment records referenced cross-application.']],note:'The study concludes that Workspace → Application → Machine remains sufficient as the hierarchy; composition instead introduces workspace services such as identity, master data, navigation, search, notifications and calendar.'},
11:{title:'Social App',domain:'Instagram-like social application',app:'Social',roles:'Member',status:'Extended portfolio',cluster:'Many-to-many relationships + feed',targets:'F20 · C12 · F14 · V05',reality:'Members post photos, follow other members, like and comment, and see a feed from people they follow.',flow:['Feed','Post','Interaction'],screens:[['Home feed','Feed / List','Relationship-filtered posts from followed members.'],['Create post','Form','Photo, caption and publish action.'],['Post detail','Detail','Photo, caption, like/comment interactions and counters.'],['Profile','Detail','Member posts, following and follower relationships.']],note:'Feed is intentionally kept because this is an extended vertical case; the repository notes that infinite-scroll/feed UI was reviewed and declined as a new admitted pattern in another case, but the domain remains part of the portfolio.'},
12:{title:'Community Site',domain:'Groups, events and participation',app:'Community',roles:'Member · Group Admin',status:'Extended portfolio',cluster:'Many-to-many + gamification',targets:'F20 · C12 · A14',reality:'Members join Groups, Groups host Events, members participate and earn points that can unlock badges.',flow:['Community','Group','Participation','Badge'],screens:[['Community home','Dashboard','Groups, upcoming events, points and badges.'],['Group detail','Detail','Members, events and group posts.'],['Event detail','Detail','Event information, RSVP/attendance and points.'],['Rewards','List / Dashboard','Points history, thresholds and earned badges.']],note:'The portfolio explicitly calls out an audit gap in the full action→points→threshold→badge→display chain; this mockup makes that chain visible for validation.'},
13:{title:'Blog / One-Page Site',domain:'Public blog',app:'Blog',roles:'Visitor · Author',status:'Extended portfolio',cluster:'Public access + page composition',targets:'P07 · V10 · F03 scope note',reality:'Anyone can read published posts and submit comments without login; only an authenticated Author writes and moderates.',flow:['Landing','Post','Comment'],screens:[['Public landing page','Composed page','Hero, featured post, recent posts, categories and public CTA.'],['Public post','Detail','Published content, author, tags and comments.'],['Comment form','Public form','Unauthenticated comment submission with moderation state.'],['Author editor','Form','Authenticated author editing and moderation.']],note:'The portfolio uses this case to prove the absence-of-user/public-access surface alongside one-page composition.'},
14:{title:'Lending Services',domain:'Loan application and repayment schedule',app:'Lending',roles:'Borrower · Loan Officer · Finance',status:'Extended portfolio',cluster:'Schedule generation',targets:'A15 · F13 · A02 · A06 · P03 · E02',reality:'A borrower applies for a loan. A Loan Officer approves it; disbursement generates the full monthly repayment schedule; repayments update installments and overdue installments are flagged.',flow:['Application','Approved','Disbursed','Repaying','Completed'],screens:[['Loan application','Form','Borrower, principal, term, rate and purpose.'],['Loan detail','Detail','Approval state, disbursement and repayment summary.'],['Repayment schedule','Schedule table','Installment number, due date, amount, paid status and overdue badge.'],['Repayment form','Form','Record a payment against an installment.']],note:'The distinctive screen is the generated schedule: one action creates many future records from a formula.'},
15:{title:'E-commerce',domain:'Product browsing, cart and checkout',app:'Commerce',roles:'Customer · Fulfillment',status:'Extended portfolio',cluster:'Mutable pre-commit document',targets:'R08 · F16 + Case 5/8/9 composition',reality:'Customers browse products, edit a cart freely and Checkout converts the cart into a real Order; payment reuses the Payment machine.',flow:['Browse','Cart','Checkout','Order'],screens:[['Product catalog','List / Grid','Searchable products with price, availability and product detail.'],['Shopping cart','Editable list','Mutable lines, quantities and totals before checkout.'],['Checkout','Form','Customer details, order review and payment handoff.'],['Order detail','Detail','Committed order header, lines, payment and fulfillment state.']],note:'The repository explicitly positions Cart as the opposite spectrum from immutable post-state data: freely editable until Checkout.'},
16:{title:'Point of Sale',domain:'Cashier checkout',app:'POS',roles:'Cashier',status:'Extended portfolio',cluster:'Composition of existing transaction shapes',targets:'Case 5 + Case 8 + Case 15',reality:'A cashier rings up line items and takes payment in one motion, with no cart lingering and no webhook delay.',flow:['Sale','Paid','Stock updated'],screens:[['POS terminal','Transaction form','Fast line-item entry, quantity edits and immediate totals.'],['Payment','Modal / Form','Tender amount, payment method and completion.'],['Sale receipt','Detail','Committed lines, payment and stock impact.']],note:'No new capability is expected; the design goal is to prove that inventory, payment and line-item shapes compose without introducing a special POS engine.'},
17:{title:'Helpdesk',domain:'Internal IT support',app:'Helpdesk',roles:'Employee · Agent · Supervisor',status:'Extended portfolio',cluster:'Domain portability of Case 7',targets:'Case 7 composition · E02/A11 · E06 · C09 · WCP-10',reality:'Internal support tickets use the same discretionary, SLA-timed and reopenable shape as Customer Complaint.',flow:['Open','Assigned','In Progress','Resolved','Reopened'],screens:[['Ticket queue','List','Open, overdue and assigned tickets.'],['Ticket detail','Detail','Issue, requester, assignee, SLA and resolution notes.'],['Investigation workspace','Flexible workspace','Ad-hoc tasks and troubleshooting notes.']],note:'This case is deliberately not a new UI pattern; it validates portability of the Case 7 cluster to an internal-support domain.'},
18:{title:'HR Operations',domain:'Employee master data',app:'HR',roles:'HR Admin · Manager',status:'Extended portfolio',cluster:'Master-data tree + cross-app reference',targets:'F13 tree · O02',reality:'The HR process already exists as Leave Request. This case adds the Employee master that Leave, Helpdesk and other apps reference.',flow:['Employee directory','Employee','Manager hierarchy'],screens:[['Employee directory','Tree / List','Employees, department, manager and active status.'],['Employee detail','Detail','Identity, manager relationship, job data and references from other apps.'],['Manager hierarchy','Tree','Self-reference rendered as an organization hierarchy.']],note:'Payroll calculation is intentionally excluded in the source case because it is treated as domain-engine logic rather than a metadata concept.'},
19:{title:'Project Management',domain:'Trello-like project boards',app:'Projects',roles:'Member · Project Lead',status:'Extended portfolio',cluster:'Manual ordering',targets:'V14 · F13 · F16',reality:'Boards contain Lists and Lists contain Cards. Users reorder Lists and Cards freely and move Cards between Lists.',flow:['Board','List','Card','Done'],screens:[['Project board','Kanban board','Columns with ordered Cards and drag-and-drop movement.','project-board.html'],['Card detail','Detail','Description, assignee, position, checklist and activity.','project-card.html'],['Checklist','Child list','Checklist items owned by the Card.']],note:'The key gap is user-set ordering rather than a declarative default sort. The repository calls this CAP-V14.'},
20:{title:'Hospital System',domain:'Appointments and clinical records',app:'Hospital',roles:'Patient · Clinician · Scheduler',status:'Extended portfolio',cluster:'Calendar + field-level confidentiality',targets:'V07 · P06 · F16',reality:'Patients are scheduled for Appointments. Each visit produces a Medical Record whose sensitive notes are visible only to the treating clinician.',flow:['Schedule','Appointment','Visit','Medical Record'],screens:[['Doctor calendar','Calendar','Day/week agenda for a clinician with scheduled appointments.'],['Appointment detail','Detail','Patient, time, clinician and visit status.'],['Medical record','Detail','Clinical notes, restricted to the treating clinician.'],['Prescription','Child list','Medication orders tied to the visit record.']],note:'The case deliberately excludes clinical decision support. Its distinct UI value is the calendar plus sensitive-field visibility.'},
21:{title:'E-learning',domain:'Course, lessons and certificates',app:'Learning',roles:'Student · Instructor',status:'Extended portfolio',cluster:'Sequential unlock + generated certificate',targets:'F21 · F20 · C12 · E06',reality:'Students enroll in courses, progress through sequentially unlocked lessons and receive a rendered certificate once complete.',flow:['Catalog','Enrollment','Lessons','Certificate'],screens:[['Course catalog','List / Grid','Courses, instructor, progress and enrollment state.'],['Course detail','Detail','Course overview and ordered lesson sequence.'],['Lesson player','Detail / Player','Current lesson with previous/next unlock state.'],['Certificate','Document / Detail','Generated certificate file and completion metadata.']],note:'The distinctive capability is runtime-rendered certificate output, the reverse direction of simple file upload storage.'}
};

function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
function render(){
 const n=new URLSearchParams(location.search).get('case')||'3'; const c=cases[n]||cases[3];
 const screenRows=c.screens.map((s,i)=>`<div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm"><div class="flex items-start justify-between gap-3"><div><div class="text-xs font-medium uppercase tracking-wide text-slate-400">Screen ${i+1} · ${esc(s[1])}</div><h3 class="mt-1 font-semibold">${esc(s[0])}</h3></div>${s[3]?`<a href="${esc(s[3])}" class="text-xs font-medium text-blue-600 hover:underline">Open mockup →</a>`:''}</div><p class="mt-3 text-sm leading-6 text-slate-600">${esc(s[2])}</p></div>`).join('');
 const flow=c.flow.map((x,i)=>`<div class="flex items-center gap-2"><span class="rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium shadow-sm">${esc(x)}</span>${i<c.flow.length-1?'<span class="text-slate-300">→</span>':''}</div>`).join('');
 document.title=`Menata Runtime — Case ${n}: ${c.title}`;
 document.getElementById('app').innerHTML=`
 <div class="mb-6 flex flex-wrap items-center gap-2 text-xs"><a href="index.html" class="text-slate-400 hover:text-slate-600">Case Portfolio</a><span class="text-slate-300">/</span><span class="font-medium text-blue-600">Case ${n}</span></div>
 <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm sm:p-8"><div class="flex flex-wrap items-start justify-between gap-4"><div><p class="text-xs font-medium uppercase tracking-wide text-blue-600">Case ${n} · ${esc(c.app)}</p><h1 class="mt-1 text-2xl font-semibold">${esc(c.title)}</h1><p class="mt-2 max-w-3xl text-sm leading-6 text-slate-600">${esc(c.reality)}</p></div><span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">${esc(c.status)}</span></div><div class="mt-6 grid gap-4 sm:grid-cols-3"><div class="rounded-lg bg-slate-50 p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Domain</div><div class="mt-1 text-sm font-medium">${esc(c.domain)}</div></div><div class="rounded-lg bg-slate-50 p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Roles</div><div class="mt-1 text-sm font-medium">${esc(c.roles)}</div></div><div class="rounded-lg bg-slate-50 p-4"><div class="text-xs uppercase tracking-wide text-slate-400">Dominant cluster</div><div class="mt-1 text-sm font-medium">${esc(c.cluster)}</div></div></div></section>
 <section class="mt-6"><div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-semibold">Business flow</h2><span class="text-xs text-slate-400">case behavior</span></div><div class="overflow-x-auto rounded-lg border border-slate-200 bg-slate-50 p-4"><div class="flex min-w-max items-center gap-2">${flow}</div></div></section>
 <section class="mt-8"><div class="mb-3 flex items-end justify-between"><div><h2 class="text-lg font-semibold">Screens for this case</h2><p class="mt-1 text-sm text-slate-500">Screen inventory derived from the case's declared business shape and existing Menata UI conventions.</p></div><span class="text-xs text-slate-400">${c.screens.length} screens</span></div><div class="grid gap-4 md:grid-cols-2">${screenRows}</div></section>
 <section class="mt-8 grid gap-6 lg:grid-cols-2"><div class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm"><h2 class="text-sm font-semibold">Primary capability targets</h2><p class="mt-3 text-sm leading-6 text-slate-600">${esc(c.targets)}</p></div><div class="rounded-lg border border-blue-100 bg-blue-50/50 p-5"><h2 class="text-sm font-semibold text-blue-900">Design note</h2><p class="mt-3 text-sm leading-6 text-blue-900/70">${esc(c.note)}</p></div></section>
 <div class="mt-8 flex items-center justify-between border-t border-slate-200 pt-5"><a href="index.html" class="text-sm text-slate-500 hover:text-slate-700">← Back to case index</a><div class="flex gap-2">${Number(n)>1?`<a href="case.html?case=${Number(n)-1}" class="rounded-md border border-slate-200 px-3 py-1.5 text-xs font-medium">Previous case</a>`:''}${Number(n)<21?`<a href="case.html?case=${Number(n)+1}" class="rounded-md bg-slate-900 px-3 py-1.5 text-xs font-medium text-white">Next case →</a>`:''}</div></div>`;
}
render();
</script>
</body>
</html>
