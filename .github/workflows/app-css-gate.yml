name: app/ CSS gate

# Ported from css-gate.yml for app/'s own path (app/ROADMAP.md Phase 5).
# Verifies every color utility class referenced by app/'s own .templ/.go
# source actually exists in the freshly-compiled web/static/css/output.css
# (a gitignored build artifact) -- see scripts/check-css-classes.sh's own
# header and prototype/go's original css-gate.yml for the full "why" (the
# bg-emerald-500/text-emerald-600 class of bug this exists to catch).
#
# GitHub-hosted, same reasoning as prototype/go's own css-gate.yml:
# menata-runtime is a public repository, so standard GitHub-hosted runner
# minutes are free and unbounded regardless of account plan.
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app-css-gate.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-css-gate.yml"

jobs:
  css-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: make check-css
