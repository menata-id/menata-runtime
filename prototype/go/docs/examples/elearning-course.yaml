# E-learning Course — Runtime Metadata
# Realization of elearning-course.menata (Case 21 — final case of this batch:
# sequential unlock reuses CAP-E06, templated certificate generation is new)
# STATUS ANNOTATIONS: [SUPPORTED] works today · [NOT YET] needs a runtime extension · [PARTIAL] limited
# References: elearning-lesson.yaml
#
# No `fld_crs_lessons` field: Lesson rows reference this Machine back
# (fld_lsn_course, see elearning-lesson.yaml), the ordinary `reference` pattern —
# corrected 2026-07-11, see roadmap.md's dated correction note.

version: "0.1"

workspace:
  id: ws_default
  name: Default Workspace

application:
  id: app_elearning                     # [SUPPORTED]
  name: E-learning
  workspace: ws_default

machine:
  id: mch_course                        # [SUPPORTED]
  name: Course
  application: app_elearning

  fields:
    - id: fld_crs_title                 # [SUPPORTED]
      name: Title
      type: text
      required: true
    - id: fld_crs_description            # [SUPPORTED]
      name: Description
      type: rich_text
      required: false

  constraints:
    - id: cst_crs_title_required           # [SUPPORTED]
      rule: Title is required.
      expression: { field: fld_crs_title, operator: required }

  permissions:
    - role: Instructor                      # [SUPPORTED]
      events: []
    - role: Student                         # [SUPPORTED]
      events: []

  views:
    - id: vw_crs_form                        # [SUPPORTED]
      name: Course Form
      type: form
      fields: [ fld_crs_title, fld_crs_description ]
      # Lesson rows render as a related-record panel scoped to this record
      # (fld_lsn_course) — a rendering concern, not a field on this Machine's own
      # form.
    - id: vw_crs_catalog                      # [SUPPORTED]
      name: Course Catalog
      type: list
      columns: [ fld_crs_title ]
    - id: vw_crs_detail                        # [SUPPORTED]
      name: Course Detail
      type: detail
