# E-commerce Cart — Runtime Metadata
# Realization of ecommerce-cart.menata
# STATUS ANNOTATIONS: [SUPPORTED] works today · [NOT YET] needs a runtime extension · [PARTIAL] limited
# References: ecommerce-product.yaml, ecommerce-order.yaml
#
# THE NEW FINDING: unlike every prior "document" (Case 9's Journal Entry, Case 14's
# Loan Application), a Cart's Draft-equivalent state ("Open") has NO constraints at
# all — no required fields, no stock check. Only Checkout (converting Cart into
# Order) is a real commit point. No capability distinguishes editable scratch state
# from a constrained Draft record.

version: "0.1"

machine:
  id: mch_cart                          # [SUPPORTED] — as a plain Machine
  name: Cart
  application: app_ecommerce

  fields:
    - id: fld_cart_customer               # [PARTIAL] — CAP-F05
      name: Customer
      type: user
      required: false
    - id: fld_cart_items                  # [NOT YET] — CAP-F16, same Language-layer gap
      name: Items                          #   as every prior child-table field
      type: child_table
      target_machine: mch_cart_item
      required: false
      # Deliberately no `required` fields inside the child rows — a Cart is
      # scratch state by design, unlike Case 9's Journal Entry Lines.
    - id: fld_cart_status                  # [SUPPORTED]
      name: Status
      type: value_list
      required: false
      values: [Open, Checked Out]

  events:
    - id: evt_cart_checkout                 # [NOT YET] — CAP-A06, converts scratch
      name: Checkout                         #   state into a real, constrained Order —
      actions:                                #   the actual commit point this case argues for
        - create_record: { machine: mch_order, fields: { customer: "{{ this.customer }}" } }
        - set_field: { field: fld_cart_status, value: Checked Out }

  permissions:
    - role: Customer                          # [SUPPORTED]
      events: [ evt_cart_checkout ]

  views:
    - id: vw_cart_my_cart                      # [SUPPORTED]
      name: My Cart
      type: detail
