# Accounting Journal Entry — Runtime Metadata
# Realization of accounting-journal-entry.menata
# Menata Runtime Prototype v0.1
#
# STATUS ANNOTATIONS:
#   [SUPPORTED]     — works in current prototype
#   [NOT YET]       — valid metadata, runtime extension required
#   [PARTIAL]       — works but with limitations noted
#
# References: accounting-chart-of-account.yaml, accounting-journal-entry-line.yaml,
# accounting-fiscal-period.yaml
#
# No `fld_je_lines` field: the Journal Entry Line rows reference this Machine back
# (fld_jel_journal_entry, see accounting-journal-entry-line.yaml), the ordinary
# `reference` pattern — same as .menata (corrected 2026-07-11, see roadmap.md's
# dated correction note). Whether Machine Interpretation physically realizes that
# relationship as a genuine scoped child table (CAP-F16, faster atomic-with-parent
# writes + optional cross-parent query) or as an ordinary independent Machine is a
# storage-strategy decision for whoever implements CAP-F16 — not yet reflected as a
# schema property here because CAP-F16 itself is still ❌ not implemented.

version: "0.1"

machine:
  id: mch_journal_entry                       # [SUPPORTED] — as a plain Machine
  name: Journal Entry
  application: app_accounting

  fields:
    - id: fld_je_entry_number                  # [NOT YET] — CAP-F18, auto-numbering
      name: Entry Number
      type: text
      required: true
      generated: true
      pattern: "JE-{YYYY}-{00001}"
      # [NOT YET] No document-sequence mechanism exists — must be hand-entered today.

    - id: fld_je_entry_date                     # [SUPPORTED]
      name: Entry Date
      type: date
      required: true

    - id: fld_je_fiscal_period                   # [SUPPORTED] — CAP-F13, implemented 2026-07-11
      name: Fiscal Period
      type: reference
      target_machine: mch_fiscal_period
      required: true

    - id: fld_je_memo                            # [SUPPORTED]
      name: Memo
      type: rich_text
      required: false

    - id: fld_je_status                          # [SUPPORTED]
      name: Status
      type: value_list
      required: false
      values: [Draft, Posted]

    - id: fld_je_prepared_by                      # [PARTIAL] — CAP-F05, free text. CAP-A02
      name: Prepared By                           #   (dynamic set_field values) is [SUPPORTED]
      type: user                                  #   for Event actions, but Create doesn't run
      required: true                              #   through that path — auto-stamping this at
      # Create time (rather than the submitter typing/picking it) is still [NOT YET]; see
      # evt_je_post below for where current_user auto-stamping does work today.

    - id: fld_je_posted_by                        # [PARTIAL] — same, stamped at Post
      name: Posted By
      type: user
      required: false

    - id: fld_je_posting_date                     # [SUPPORTED] — as a field; stamping it is not
      name: Posting Date
      type: date
      required: false

  events:
    - id: evt_je_post                             # [PARTIAL] — the actions below are all
      name: Post                                  #   [SUPPORTED]; the three cst_je_* constraint
      actions:                                     #   ROWS below still can't be evaluated (see
                                                     #   their own notes) — a different gap than
                                                     #   whether the event-trigger mechanism works
        - set_field: { field: fld_je_posting_date, value: today }
          # [SUPPORTED] — CAP-A02, implemented 2026-07-11: resolves to the real
          # current date, not the literal string "today".
        - set_field: { field: fld_je_posted_by, value: current_user }
          # [SUPPORTED] — CAP-A02, same. Resolves to the acting role (this
          # prototype's only identity concept today, see fld_je_prepared_by's note).
        - set_field: { field: fld_je_status, value: Posted }
          # [SUPPORTED] — static value works today.
      # CAP-C09 (constraints evaluated on event trigger, not just Create) is
      # [SUPPORTED] as of 2026-07-11 — the *mechanism* now re-checks every
      # declared Constraint before an event's write commits. That doesn't make
      # the three cst_je_* rows below evaluable, though: they use expression
      # shapes (`exists`, `aggregate`, a field on a *different* record) the
      # constraint engine's flat field/operator/value evaluator doesn't parse
      # at all — a separate gap (CAP-C10/C11 territory), not CAP-C09's.

  constraints:
    - id: cst_je_entry_number_required             # [SUPPORTED]
      rule: Entry Number is required.
      expression: { field: fld_je_entry_number, operator: required }

    - id: cst_je_entry_date_required               # [SUPPORTED]
      rule: Entry Date is required.
      expression: { field: fld_je_entry_date, operator: required }

    - id: cst_je_fiscal_period_required            # [SUPPORTED]
      rule: Fiscal Period is required.
      expression: { field: fld_je_fiscal_period, operator: required }

    - id: cst_je_lines_required                    # [NOT YET] — existence check over a related
      rule: At least one Journal Entry Line is required.                     # Machine, not a field
      expression:
        exists: true
        target_machine: mch_journal_entry_line
        scoped_by: fld_jel_journal_entry
      # [NOT YET] No "at least one related record exists" constraint mechanism
      # exists yet — depends on CAP-F16 (or at minimum CAP-F13's reference)
      # existing first.

    - id: cst_je_debit_equals_credit                # [NOT YET] — CAP-C10, aggregate over
      rule: Sum of Lines Debit Amount must equal sum of Lines Credit Amount.  # related-Machine rows
      expression:
        aggregate: sum
        field: fld_jel_debit_amount
        target_machine: mch_journal_entry_line
        scoped_by: fld_jel_journal_entry
        operator: equals
        compare_aggregate:
          aggregate: sum
          field: fld_jel_credit_amount
          target_machine: mch_journal_entry_line
          scoped_by: fld_jel_journal_entry
      # [NOT YET] The double-entry invariant. No aggregate-over-related-records
      # constraint mechanism exists yet — depends on CAP-F16 existing first.

    - id: cst_je_period_not_closed                  # [NOT YET] — CAP-C11
      rule: Fiscal Period must not be Closed.
      expression:
        field: fld_period_status                   # on the referenced Fiscal Period record
        operator: not_equals
        value: Closed
      # [NOT YET] Cross-record + reference-data-driven temporal constraint.

    - id: cst_je_separation_of_duties               # [NOT YET] — CAP-P03, first case evidence
      rule: Posted By must not equal Prepared By.
      expression:
        field: fld_je_posted_by
        operator: not_equals
        compare_field: fld_je_prepared_by
      # [NOT YET] SOX segregation of duties. Registered since Study 1 mapping
      # (spec 004 example) but had NO case evidence until this one — the World-
      # Class Standards Addendum caught that Study 6's original 7 declared
      # targets missed this entirely.

  permissions:
    - role: Accountant                              # [SUPPORTED]
      events: [ evt_je_post ]
    - role: Supervisor                              # [SUPPORTED]
      events: [ evt_je_post ]

  views:
    - id: vw_je_form                                # [SUPPORTED]
      name: Entry Form
      type: form
      fields:
        - fld_je_entry_date
        - fld_je_fiscal_period
        - fld_je_memo
      # Journal Entry Line rows render as a related-record panel scoped to this
      # record (fld_jel_journal_entry) — a rendering concern, not a field on this
      # Machine's own form.

    - id: vw_je_draft                               # [SUPPORTED] — as a plain list; filtering
      name: Draft Entries                           #   by Status = Draft needs CAP-V09
      type: list
      columns:
        - fld_je_entry_number
        - fld_je_entry_date
        - fld_je_prepared_by
        - fld_je_status

    - id: vw_je_posted                              # [SUPPORTED] — same
      name: Posted Entries
      type: list
      columns:
        - fld_je_entry_number
        - fld_je_posting_date
        - fld_je_posted_by

    - id: vw_je_detail                              # [SUPPORTED]
      name: Entry Detail
      type: detail
