# E-commerce Order — Runtime Metadata
# Realization of ecommerce-order.menata
# STATUS ANNOTATIONS: [SUPPORTED] works today · [NOT YET] needs a runtime extension · [PARTIAL] limited
# References: ecommerce-cart.yaml, ecommerce-product.yaml, ecommerce-order-line.yaml
# Same header+line-item shape as Case 9's Journal Entry — not re-derived; see that
# case's CAP-F16 reporting-independence note, which applies here too (Order Line
# rows need to be queryable across orders for sales reporting).
#
# No `fld_ord_lines` field: Order Line rows reference this Machine back
# (fld_ordl_order, see ecommerce-order-line.yaml), the ordinary `reference`
# pattern — corrected 2026-07-11, see roadmap.md's dated correction note.

version: "0.1"

machine:
  id: mch_order                          # [SUPPORTED] — as a plain Machine
  name: Order
  application: app_ecommerce

  fields:
    - id: fld_ord_number                   # [NOT YET] — CAP-F18
      name: Order Number
      type: text
      required: true
      generated: true
      pattern: "ORD-{00001}"
    - id: fld_ord_customer                  # [PARTIAL] — CAP-F05
      name: Customer
      type: user
      required: true
    - id: fld_ord_total_amount                # [NOT YET] — CAP-F14, aggregate rollup
      name: Total Amount
      type: money
      computed: true
      formula: "sum(order_line.line_total where order = this)"
      options: { currency: "IDR" }
    - id: fld_ord_status                       # [SUPPORTED]
      name: Status
      type: value_list
      required: false
      values: [Pending, Paid, Fulfilled]
    - id: fld_ord_placed_at                     # [SUPPORTED] — as a field; stamping is not
      name: Placed At
      type: date
      required: false

  constraints:
    - id: cst_ord_number_required               # [SUPPORTED]
      rule: Order Number is required.
      expression: { field: fld_ord_number, operator: required }
    - id: cst_ord_customer_required             # [SUPPORTED]
      rule: Customer is required.
      expression: { field: fld_ord_customer, operator: required }
    - id: cst_ord_lines_required                # [NOT YET] — existence check over a related
      rule: At least one Order Line is required.  #   Machine, not a field
      expression:
        exists: true
        target_machine: mch_order_line
        scoped_by: fld_ordl_order

  permissions:
    - role: Customer                             # [SUPPORTED]
      events: []
    - role: Fulfillment                          # [SUPPORTED]
      events: []

  views:
    - id: vw_ord_list                             # [SUPPORTED]
      name: Order List
      type: list
      columns: [ fld_ord_number, fld_ord_customer, fld_ord_total_amount, fld_ord_status ]
    - id: vw_ord_detail                            # [SUPPORTED]
      name: Order Detail
      type: detail
