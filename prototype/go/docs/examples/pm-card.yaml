# Project Management Card — Runtime Metadata
# Realization of pm-card.menata
# STATUS ANNOTATIONS: [SUPPORTED] works today · [NOT YET] needs a runtime extension · [PARTIAL] limited
# References: pm-list.yaml, pm-checklist-item.yaml
# Second instance of CAP-V14 (manual ordering) — Cards reorder both within a List
# and across Lists (Move), the latter also writing a different List's reference.
#
# No `fld_crd_checklist` field: Checklist Item rows reference this Machine back
# (fld_ck_card, see pm-checklist-item.yaml), the ordinary `reference` pattern —
# corrected 2026-07-11, see roadmap.md's dated correction note.

version: "0.1"

machine:
  id: mch_card                          # [SUPPORTED] — as a plain Machine
  name: Card
  application: app_project_management

  fields:
    - id: fld_crd_list                   # [SUPPORTED] — CAP-F13, implemented 2026-07-11
      name: List
      type: reference
      target_machine: mch_list
      required: true
    - id: fld_crd_title                   # [SUPPORTED]
      name: Title
      type: text
      required: true
    - id: fld_crd_description              # [SUPPORTED]
      name: Description
      type: rich_text
      required: false
    - id: fld_crd_position                  # [PARTIAL] — CAP-F07; see evt_crd_move
      name: Position
      type: number
      required: false
    - id: fld_crd_assignee                   # [PARTIAL] — CAP-F05
      name: Assignee
      type: user
      required: false
    - id: fld_crd_due_date                    # [SUPPORTED]
      name: Due Date
      type: date
      required: false
  events:
    - id: evt_crd_move                          # [NOT YET] — CAP-V14, second instance;
      name: Move                                  #   also changes List (a cross-record
      actions:                                     #   reference write, CAP-F13, plus the
        - set_field: { field: fld_crd_list, value: "{{ input.target_list }}" }  # reorder itself)
        - renumber_siblings: { scope: fld_crd_list, order_field: fld_crd_position }

  constraints:
    - id: cst_crd_list_required                  # [SUPPORTED]
      rule: List is required.
      expression: { field: fld_crd_list, operator: required }
    - id: cst_crd_title_required                  # [SUPPORTED]
      rule: Title is required.
      expression: { field: fld_crd_title, operator: required }

  permissions:
    - role: Member                                 # [SUPPORTED]
      events: [ evt_crd_move ]

  views:
    - id: vw_crd_form                               # [SUPPORTED]
      name: Card Form
      type: form
      fields: [ fld_crd_title, fld_crd_description, fld_crd_assignee, fld_crd_due_date ]
      # Checklist Item rows render as a related-record panel scoped to this
      # record (fld_ck_card) — a rendering concern, not a field on this Machine's
      # own form.
    - id: vw_crd_list_cards                          # [NOT YET] — CAP-V05 filter List = this,
      name: List Cards                                #   sorted by Position
      type: list
      columns: [ fld_crd_title, fld_crd_assignee, fld_crd_due_date ]
    - id: vw_crd_detail                               # [SUPPORTED]
      name: Card Detail
      type: detail
