# Approval Step — Runtime Metadata
# Realization of approval-step.menata
# Menata Runtime Prototype v0.1
#
# STATUS ANNOTATIONS:
#   [SUPPORTED]     — works in current prototype
#   [NOT YET]       — valid metadata, runtime extension required
#   [PARTIAL]       — works but with limitations noted

version: "0.1"

machine:
  id: mch_approval_step                  # [SUPPORTED] — machine itself loads fine
  name: Approval Step
  application: app_approval

  fields:
    - id: fld_as_document                 # [SUPPORTED] — CAP-F13, implemented 2026-07-11
      name: Document
      type: reference
      required: true
      target_machine: mch_approval_document

    - id: fld_as_approver                 # [SUPPORTED]
      name: Approver
      type: user
      required: true

    - id: fld_as_sequence                 # [SUPPORTED] — stored as text (number not yet rendered)
      name: Sequence
      type: number
      required: true

    - id: fld_as_decision                 # [SUPPORTED]
      name: Decision
      type: value_list
      required: false
      values:
        - Pending
        - Approved
        - Rejected

    - id: fld_as_notes                    # [SUPPORTED]
      name: Notes
      type: rich_text
      required: false

    - id: fld_as_decided_at              # [SUPPORTED] — stored as text in current prototype
      name: Decided At
      type: date_time
      required: false

  events:
    - id: evt_as_approve                  # [SUPPORTED] — CAP-E06 guard + CAP-A02/A07/A08
      name: Approve
      condition:
        field: fld_as_decision
        operator: equals
        value: Pending
      actions:
        - set_field: { field: fld_as_decision, value: Approved }
        - set_field: { field: fld_as_decided_at, value: now }
          # [SUPPORTED] CAP-A02, implemented 2026-07-11: resolves to the real
          # current timestamp, not the literal string "now".
        - notify: { role: Submitter }
        - activate_next: { mode_field: fld_ad_approval_mode }
          # [SUPPORTED] CAP-A07, implemented 2026-07-11. In Sequential mode, notifies
          # the next still-Pending sibling by Sequence (logged only, like every other
          # `notify` in this prototype) — no-op in Parallel mode. The actual ordering
          # enforcement is a hard block on THIS event, driven by the aggregate_status
          # action below, not by activate_next itself — see capability-registry.md
          # (CAP-A07) for why a notify-only "activation" wasn't enough.
        - aggregate_status:
            parent_field: fld_as_document
            parent_event_if_all_approved: evt_ad_approve
            parent_event_if_any_rejected: evt_ad_reject
          # [SUPPORTED] CAP-A08, implemented 2026-07-11. Also the source of CAP-A07's
          # hard block: declaring aggregate_status on an event makes the runtime
          # cross-record-check sibling Steps (same Document, lower Sequence, still
          # Pending) before allowing it to fire at all in Sequential mode — 400 if
          # one exists. Checks siblings after commit: all Approved → evt_ad_approve
          # on the Document; any Rejected → evt_ad_reject, immediately, not waiting
          # for the rest to decide.

    - id: evt_as_reject                   # [SUPPORTED] — CAP-E06 guard + CAP-A02/A08
      name: Reject
      condition:
        field: fld_as_decision
        operator: equals
        value: Pending
      actions:
        - set_field: { field: fld_as_decision, value: Rejected }
        - set_field: { field: fld_as_decided_at, value: now }
          # [SUPPORTED] CAP-A02, same as Approve above.
        - notify: { role: Submitter }
        - aggregate_status:
            parent_field: fld_as_document
            parent_event_if_all_approved: evt_ad_approve
            parent_event_if_any_rejected: evt_ad_reject
          # [SUPPORTED] CAP-A08, same as Approve above — also applies the CAP-A07
          # sequential guard to Reject, not just Approve (a step can't jump the
          # queue to reject early any more than it can to approve early).

  constraints:
    - id: cst_as_notes_if_rejected        # [SUPPORTED] — conditional constraint works
      rule: Notes is required.
      expression:
        field: fld_as_notes
        operator: required
      condition:
        field: fld_as_decision
        operator: equals
        value: Rejected

    - id: cst_as_document_required        # [SUPPORTED] — added 2026-07-11, discovered missing
      rule: Document is required.         #   during manual verification of CAP-A07/A08
      expression:
        field: fld_as_document
        operator: required

    - id: cst_as_approver_required        # [SUPPORTED]
      rule: Approver is required.
      expression:
        field: fld_as_approver
        operator: required

    - id: cst_as_sequence_required        # [SUPPORTED]
      rule: Sequence is required.
      expression:
        field: fld_as_sequence
        operator: required

  permissions:
    - role: Approver                      # [PARTIAL] — permission guard works,
      events: [ evt_as_approve, evt_as_reject ]
      # but "only the assigned Approver for this Step" is not enforceable.
      # Current prototype checks role string only, not record-level ownership.
      # Requires: record-level permission (field: fld_as_approver = current_user).

  views:
    - id: vw_as_detail                    # [SUPPORTED]
      name: Step Detail
      type: detail

    - id: vw_as_progress                  # [PARTIAL] — CAP-F13 reference now supported
      name: Approval Progress             #   (Document column renders/links correctly); still
      type: list                          #   can't declaratively filter this list to one
                                            #   parent's steps only — that's CAP-V05, unrelated
      columns:
        - fld_as_approver
        - fld_as_sequence
        - fld_as_decision
        - fld_as_decided_at
      default_sort:
        field: fld_as_sequence
        direction: asc
